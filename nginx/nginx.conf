server {
    listen 80;

    location / {
        # O truque mágico: redireciona para o nome do serviço do compose
        proxy_pass http://node_app:3000;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
# O Nginx escuta internamente na porta 80. 
# O proxy_pass http://node_app:3000 diz: 
# "Qualquer requisição que chegar aqui, repasse integralmente 
#  para o container que se chama node_app na porta 3000".